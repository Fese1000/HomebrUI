<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomebrUI</title><link rel="stylesheet" href="/style.css"></head><body>
<aside>
 <div class="brand"><span class="beer">🍺</span><span class="word">Homebr<b>UI</b></span></div>
 <nav id="nav"></nav>
 <div class="side-foot"><button id="quit" title="HomebrUI beenden" aria-label="Beenden"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button><button id="settings" title="Einstellungen" aria-label="Einstellungen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><button id="reload" title="Neu laden" aria-label="Neu laden"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></div>
</aside>
<main id="view"><div class="empty">Loading …</div></main>

<div class="foot" id="foot"><b id="cnt"></b><span id="sz" class="sub"></span><span class="grow"></span>
 <button class="btn" id="clr">Clear</button><button class="btn" id="mark">Mark as installed by me</button>
 <button class="btn" id="ign">Ignore</button><button class="btn danger" id="del">Uninstall …</button></div>

<div id="jobs" class="jobs"><div class="jobhead" id="jobhead"><b id="jobtitle">Tasks</b><span id="jobstate" class="tag"></span>
 <span class="grow"></span><button class="btn small" id="jobcancel" hidden>Cancel</button><button class="btn small" id="jobtoggle">open</button></div>
 <div class="jobbody"><div id="joblist"></div><pre id="joblog"></pre></div></div>

<dialog id="dlg"></dialog>
<script src="/i18n.js"></script><script src="/app.js"></script></body></html>
